name: Build portable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0-early.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build portable package
        run: python scripts/build_portable.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: package-${{ matrix.platform }}
          path: dist/LLMExtractor-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate update manifest
        run: >
          python scripts/generate_update_manifest.py
          --dist-dir dist
          --base-url "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}"
          --output dist/update_manifest.json
          --notes "Early release ${{ env.RELEASE_TAG }}"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Early release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/LLMExtractor-*.zip dist/update_manifest.json --clobber
